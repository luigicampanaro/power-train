[project]
name = "diff-style"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "h5py==3.15.1",
    "hydra-core==1.3.2",
    "numpy==2.2.6",
    "pytorch-lightning==2.6.1",
    "tensorboard==2.21.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==5.1.0",
]

[dependency-groups]
dev = [
    "marimo>=0.25.1",
    "pytest==9.0.2",
    "ty==0.0.100",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10"]
build-backend = "uv_build"

[tool.ty.environment]
python = "./.venv"  # resolve imports from this project's environment, not the system Python

[tool.marimo.runtime]
reactive_tests = false  # marimo 0.25 crashes running test_* cells in the kernel, hanging `marimo edit`/`export`; use `uv run pytest`

[tool.pytest.ini_options]
testpaths = ["tests"]  # test_*.py marimo notebooks: pytest collects their top-level test_* functions
markers = ["slow: minutes long (torch.compile of the real DINOv3); skipped by default, run with -m slow"]
addopts = "-m 'not slow'"

[tool.uv]
python-preference = "only-managed"  # uv's Python ships the headers torch.compile needs to build its kernels; the system one may not

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true  # only torch/torchvision come from here; everything else from PyPI
